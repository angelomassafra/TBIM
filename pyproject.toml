[project]
name = "tbim"
version = "3.2.0"
description = "Topological BIM (TBIM) for building performance management - pyRevit extension"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
# the geometry kernel, pythonocc-core, is on conda-forge only: see environment.yml
dependencies = ["topologicpy==0.9.87", "honeybee-energy==1.126.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
topologic-core = ["topologic_core==8.0.4"]  # fallback kernel without conda

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["pyRevit/pyRevit_extensions/TBIM.extension/lib"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
