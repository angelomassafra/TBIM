[project]
name = "tbim"
version = "3.1.0"
description = "Topological BIM (TBIM) for building performance management - pyRevit extension"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["topologicpy==0.9.87", "topologic_core==8.0.4", "honeybee-energy==1.126.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["pyRevit/pyRevit_extensions/TBIM.extension/lib"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
